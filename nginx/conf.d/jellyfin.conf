server {
    listen 80;
    server_name malihome.jellyfin;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name malihome.jellyfin;

    ssl_certificate     /etc/nginx/certs/home.local.crt;
    ssl_certificate_key /etc/nginx/certs/home.local.key;

    client_max_body_size 20M;

    location / {
        proxy_pass http://jellyfin:8096;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Jellyfin uses WebSockets for playback session state
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection;

        # Required for smooth streaming — nginx must not buffer media
        proxy_buffering off;
    }
}
