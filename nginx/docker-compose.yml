services:
  nginx:
    container_name: "${NGINX_CONTAINER_NAME:-nginx-reverse-proxy}"
    image: nginx:latest
    env_file:
      - ./.env
    environment:
      # Render templates/*.template with envsubst, substituting ONLY these vars (so nginx's
      # own $host/$scheme/$http_upgrade/etc. are left untouched). At container start the
      # nginx image renders them into conf.d/, taking the real hostnames from .env
      # (CALIMALI_PUBLIC_HOST, JELLYFIN_SERVER_NAME). Those rendered conf.d/*.conf are gitignored.
      NGINX_ENVSUBST_FILTER: "(CALIMALI_|JELLYFIN_)"
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
      - "${NGINX_HOST_PORT_HTTPS:-443}:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d
      - ./templates:/etc/nginx/templates:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - homelab
    restart: unless-stopped

networks:
  homelab:
    external: true
    name: homelab
