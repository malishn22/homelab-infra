# Global Config
global:
# Default is every 1 minute.
  scrape_interval: 15s
  evaluation_interval: 15s 

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          app: "node_exporter"
  
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          app: "nginx_exporter"

  - job_name: "ghms"
    static_configs:
      - targets: ["ghms-backend:8000"]
        labels:
          app: "ghms_backend"

  - job_name: "spotify-archiver"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          app: "spotify_archiver_backend"

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          app: "cadvisor"
