# Global Config
global:
# Default is every 1 minute.
  scrape_interval: 15s
  evaluation_interval: 15s 

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Loaded from a directory mounted separately in docker-compose.yml — prometheus.yml
# itself is a single-file mount, so this path would not exist without it.
# A glob matching zero files is tolerated silently; a MALFORMED rule file makes
# Prometheus refuse to start. Always run `promtool check rules` before restarting.
rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          app: "node_exporter"
  
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          app: "nginx_exporter"

  - job_name: "ghms"
    static_configs:
      - targets: ["ghms-backend:8000"]
        labels:
          app: "ghms_backend"

  - job_name: "spotify-archiver"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          app: "spotify_archiver_backend"

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          app: "cadvisor"

  # Scraping Alertmanager means the TargetDown rule covers the alerting path itself.
  # It cannot notify about its own death — nothing can, on a single host — but the
  # Grafana UI and the Alertmanager datasource will show it.
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          app: "alertmanager"
