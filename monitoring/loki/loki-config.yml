# Single-binary Loki, filesystem storage. Reachable in-network as loki:3100.
# Logs are kept for retention_period (7d) and pruned by the compactor.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

# Log-based alerting. nginx exposes no status codes through stub_status — they exist
# only in the access log — so any alert on HTTP errors has to be evaluated here rather
# than in Prometheus. Firing alerts go to the same Alertmanager as the metric rules.
#
# TRAP: rules must live in a PER-TENANT subdirectory. With auth_enabled: false the
# tenant id is the literal string "fake", so the files belong at
# /etc/loki/rules/fake/*.yml — not at /etc/loki/rules/. Files in the wrong place are
# ignored silently, with no error in the log. Verify with the ruler API after starting:
#   docker exec grafana curl -s http://loki:3100/loki/api/v1/rules
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  # Scratch space for the ruler's own state — inside the loki-data volume, distinct
  # from the read-only rules mount above.
  rule_path: /loki/rules-scratch
  alertmanager_url: http://alertmanager:9093
  enable_alertmanager_v2: true
  enable_api: true
  ring:
    kvstore:
      store: inmemory
