# Alertmanager routing for the homelab host.
#
# Both rule sources converge here: Prometheus evaluates the metric rules in
# prometheus/rules/, Loki's ruler evaluates the log rules in loki/rules/fake/,
# and both push to this one Alertmanager so there is a single notification path.
#
# The Discord webhook URL is NOT in this file. Alertmanager does not expand
# environment variables in its YAML, so the secret is supplied through
# webhook_url_file, pointing at a gitignored file created by hand.
#
# WARNING (verified against Alertmanager 0.34.0): a missing discord_url does NOT
# prevent startup. Alertmanager boots, listens on 9093 and looks entirely healthy;
# the file is read only when a notification is sent. So a broken notification path
# stays invisible until the first real alert — which is the worst possible moment
# to discover it. Prove delivery with the synthetic-alert test in README.md instead
# of trusting a green container.
#
# Check with:
#   docker run --rm -v "$PWD:/cfg" prom/alertmanager:latest amtool check-config /cfg/alertmanager.yml

global:
  # How long after the last firing evaluation an alert is considered resolved.
  # Prometheus re-sends firing alerts every evaluation_interval (15s), so 5m is
  # generous headroom.
  resolve_timeout: 5m

# Your name and Discord id, kept out of this public repo. Copy
# templates/discord.tmpl.example to templates/discord.tmpl and fill it in —
# REQUIRED, same as discord_url. The .example is not matched by *.tmpl.
templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  receiver: discord
  # Group by the alert and the job it came from, so a single exporter dying does
  # not fan out into one Discord message per series.
  group_by: ['alertname', 'job']
  # Wait this long for other alerts in the same group before sending the first
  # notification — turns a burst into one message.
  group_wait: 30s
  # Wait this long before notifying about NEW alerts added to an existing group.
  group_interval: 5m
  # Effectively "never repeat". Alertmanager has no way to disable repeats, so this
  # is a year — long enough that no incident will ever reach it.
  #
  # Chosen deliberately: one ping when a problem starts, one when it clears, and
  # nothing in between. The trade-off is real and worth knowing — if you miss the
  # single notification, nothing will ever tell you again, and you would only find
  # out by opening a dashboard. Set this to 12h (2h for critical) to get a reminder
  # for anything still broken later.
  repeat_interval: 8760h

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /etc/alertmanager/discord_url
        # Send the "resolved" message too — otherwise a fixed problem stays
        # visually unresolved in the channel and trains you to distrust it.
        send_resolved: true
        # The @-mention goes in `content` — Discord only notifies for a mention in the
        # message body, not for one inside an embed.
        #
        # The <@ > wrapper is Discord's own mention format and lives here, not in
        # templates/discord.tmpl, so that file only ever holds the bare numeric id.
        content: '<@{{ template "discord.mention" . }}>'
        # The greeting goes inside the embed. discord.default.message is
        # Alertmanager's built-in body; composing with it keeps the standard
        # firing/resolved formatting instead of reinventing it.
        message: |-
          Heyo {{ template "discord.name" . }}
          {{ template "discord.default.message" . }}

inhibit_rules:
  # If something is already critical, do not also send the warning-level alert
  # for the same thing on the same instance.
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['alertname', 'instance']
