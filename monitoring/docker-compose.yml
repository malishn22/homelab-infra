services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=2GB'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      # Alert rules. prometheus.yml mounts as a single FILE, so this directory needs its
      # own mount or rule_files resolves to a path that does not exist in the container.
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - homelab
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
    networks:
      - homelab
    volumes:
      - '/:/host:ro,rslave'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TERM=linux
      - GF_PLUGINS_PREINSTALL=grafana-clock-panel,grafana-polystat-panel
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in monitoring/.env}
    ports:
      - '3000:3000'
    networks:
      - homelab
    volumes:
      - 'grafana_storage:/var/lib/grafana'
      - './grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro'
      - './grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro'
      - './grafana/dashboards:/etc/grafana/dashboards:ro'
   
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    command:
      - -nginx.scrape-uri=http://nginx:8080/stub_status
    ports:
      - "9113:9113"
    networks:
      - homelab
    restart: unless-stopped

  # Per-container CPU/mem/liveness metrics. Scraped over the homelab network as
  # cadvisor:8080 (host 8080 is taken by calimali, so no port is published).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - homelab

  # Log store for container stdout. Reachable in-network as loki:3100
  # (Grafana datasource + Promtail push); no host port published.
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      # Log alert rules. Must contain a per-tenant subdirectory: auth_enabled is false,
      # so Loki looks in rules/fake/ and silently ignores anything at the top level.
      - ./loki/rules:/etc/loki/rules:ro
      - loki-data:/loki
    networks:
      - homelab

  # Discovers all containers via the Docker API and ships their stdout to Loki.
  # user: root so it can read the root:docker-owned docker.sock.
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    user: root
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp
    depends_on:
      - loki
    networks:
      - homelab

  # Routes firing alerts from BOTH rule sources (Prometheus metrics, Loki logs) to a
  # single Discord webhook. Reached in-network as alertmanager:9093; no host port is
  # published, following the cAdvisor/Loki precedent — two systems allocate host ports
  # on this box independently, and publishing nothing sidesteps that entirely.
  #
  # The Discord webhook URL is NOT in alertmanager.yml. Alertmanager does not expand
  # env vars in its config, so it reads the secret from ./alertmanager/discord_url
  # (gitignored) via webhook_url_file.
  #
  # WARNING, verified against 0.34.0: a missing discord_url does NOT stop Alertmanager
  # booting. It starts, listens, and looks perfectly healthy — the file is only read
  # when a notification is actually sent, so the failure surfaces the first time an
  # alert fires and nobody sees it. Copy discord_url.example to discord_url with the
  # real webhook BEFORE `up`, then prove delivery with the synthetic-alert test in
  # README.md. Do not assume it works because the container is green.
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      # The whole directory, deliberately, not the two files individually. Docker's
      # bind mounts create a missing source as a DIRECTORY, so mounting ./alertmanager
      # /discord_url directly would silently produce a directory named discord_url on a
      # first run and Alertmanager would fail with "is a directory" — confusing, and it
      # persists until you delete it. Mounting the parent means a missing secret fails
      # cleanly with "no such file".
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    networks:
      - homelab

volumes:
  prometheus-data:
  grafana_storage: {}
  loki-data: {}
  promtail-positions: {}
  alertmanager-data: {}

networks:
  homelab:
    external: true